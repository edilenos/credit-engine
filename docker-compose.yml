# Stack completa: banco, API e frontend (PBI-38).
#
# Uso:
#   cp .env.example .env     # preencha DB_PASSWORD
#   docker compose up --build
#
#   frontend  http://localhost:3000
#   API       http://localhost:8081
#   Swagger   http://localhost:8081/swagger-ui.html
#
# Para desenvolver com API e frontend fora do container, subindo so o banco:
#   docker compose up -d db
#
# A chave 'version:' e' obsoleta no Compose v2 e foi omitida de proposito.

services:
  db:
    image: postgres:17.5-alpine
    container_name: credit-engine-db
    restart: unless-stopped
    environment:
      # Sem valor default: se .env nao existir, o Compose falha com esta
      # mensagem em vez de subir um banco com senha adivinhavel.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env (veja .env.example)}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_NAME:-credit-engine}
      # Acelera o initdb; irrelevante para producao, util no ciclo local.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # 55432 no host, de proposito fora da faixa 543x: nesta maquina um tunel SSH
      # no WSL ocupa 5433 e 5434 em 127.0.0.1, e o bind mais especifico vence o
      # 0.0.0.0 do Docker. Dentro da rede do Compose o servico segue na 5432.
      - "${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # O -U/-d evitam falso positivo: pg_isready sem argumentos responde OK
      # durante o initdb, antes de o banco da aplicacao existir.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-credit-engine}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./apps/api
    container_name: credit-engine-api
    restart: unless-stopped
    depends_on:
      db:
        # service_healthy, e nao service_started: o Flyway roda na subida e
        # falharia contra um Postgres que aceitou a conexao TCP mas ainda esta
        # no initdb.
        condition: service_healthy
    environment:
      # Nome do servico e porta INTERNA (5432). O mapeamento 55432 e' so para
      # o host — dentro da rede do Compose ele nao existe.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-credit-engine}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      SERVER_PORT: 8081
      # Origem do NAVEGADOR, nao do container: o CORS e' avaliado contra o
      # cabecalho Origin que o browser envia.
      APP_CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
      LOG_FORMATO: ${LOG_FORMATO:-ecs}
      LOG_NIVEL: ${LOG_NIVEL:-INFO}
    ports:
      - "${API_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./apps/frontend
      args:
        # ARG e nao environment: NEXT_PUBLIC_* e' substituida em tempo de BUILD.
        # Definir aqui em `environment` nao teria efeito nenhum — quando o
        # container sobe, o valor ja esta dentro do bundle.
        #
        # E precisa ser alcancavel pelo NAVEGADOR. Quem chama a API e' o browser
        # do operador; `http://api:8081` resolveria entre containers e daria
        # erro de DNS na maquina dele.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    container_name: credit-engine-frontend
    restart: unless-stopped
    depends_on:
      api:
        # Nao ha chamada de container para container — o browser e' que fala com
        # a API. A dependencia existe para a ordem de subida ser previsivel e
        # para o frontend nao ser anunciado antes de haver o que consumir.
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
    name: credit-engine-pgdata
