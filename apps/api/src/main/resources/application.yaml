server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: credit-engine

  # Credenciais locais ficam em ./application-local.yaml (fora do versionamento).
  # O import e' opcional: em CI/Docker as variaveis de ambiente abaixo assumem.
  config:
    import: optional:file:./application-local.yaml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/credit-engine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: credit-engine-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Schema e' responsabilidade do Flyway; o Hibernate apenas confere.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
