server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: credit-engine

  # Credenciais locais ficam em ./application-local.yaml (fora do versionamento).
  # O import e' opcional: em CI/Docker as variaveis de ambiente abaixo assumem.
  config:
    import: optional:file:./application-local.yaml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/credit-engine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: credit-engine-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Schema e' responsabilidade do Flyway; o Hibernate apenas confere.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Teto de paginacao: sem ele, o cliente contorna a paginacao pedindo
  # size=1000000 e derruba a garantia de que nenhuma colecao e' ilimitada.
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        # Lista explicita, nunca "*". Com curinga entram env, configprops,
        # beans e heapdump — que despejam configuracao efetiva, incluindo
        # valores de variaveis de ambiente, e memoria do processo.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      # Toda metrica sai identificada pela aplicacao: sem isso, dois servicos
      # no mesmo Prometheus produzem series indistinguiveis.
      application: ${spring.application.name}

logging:
  structured:
    format:
      # Formato nativo do Boot 4 — nao precisa de logstash-logback-encoder.
      # ECS e' esquema publicado, entao o log e' parseavel por qualquer coletor
      # sem combinar campos caso a caso.
      console: ${LOG_FORMATO:ecs}
  level:
    root: ${LOG_NIVEL:INFO}
    br.com.srm.creditengine: ${LOG_NIVEL_APP:INFO}

app:
  limites:
    # Teto do corpo da requisicao. Nao ha propriedade equivalente no Boot 4:
    # server.max-http-post-size esta deprecada em nivel de erro e o substituto
    # so vale para form-urlencoded. Um lote cheio (500 titulos) fica na casa de
    # 100 KB, entao 1 MB da folga larga e ainda barra payload abusivo.
    tamanho-maximo-do-corpo: 1MB

  cors:
    # Origens do SPA. Lista explicita, nunca "*": com curinga, qualquer pagina
    # aberta na maquina do operador poderia chamar a API em nome dele.
    origens: ${APP_CORS_ORIGINS:http://localhost:3000}

# Provedor externo de cotacao. Mockado neste desafio: a URL padrao aponta para
# um host inexistente de proposito, e' o que torna o circuit breaker e o
# fallback observaveis logo apos subir o sistema.
cambio:
  provedor:
    url-base: ${COTACAO_URL_BASE:http://provedor-de-cotacao.invalido}
    caminho: /cotacoes/{origem}/{destino}
    # Chamada externa sem timeout transforma lentidao alheia em
    # indisponibilidade propria. O default do JDK e' esperar para sempre.
    timeout-conexao: 2s
    timeout-leitura: 3s

resilience4j:
  retry:
    instances:
      provedorDeCotacao:
        max-attempts: 3
        wait-duration: 200ms
        # Backoff exponencial: 200ms, 400ms, 800ms. Repetir no mesmo ritmo
        # contra um servico em recuperacao so ajuda a mante-lo caido.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - br.com.srm.creditengine.integracao.cotacao.ProvedorIndisponivelException
  circuitbreaker:
    instances:
      provedorDeCotacao:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # Sem minimo, uma unica falha na primeira chamada abriria o circuito.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - br.com.srm.creditengine.integracao.cotacao.ProvedorIndisponivelException

# Politica de precificacao por produto.
precificacao:
  cheque:
    # Cheque tem horizonte: a Lei 7.357/85 fixa 30 dias para apresentacao na
    # mesma praca e 60 fora dela, com prescricao 6 meses depois. Passado esse
    # limite o titulo deixa de ser executavel, e antecipar contra ele nao e'
    # operacao de credito. Parametro de politica, ajustavel pela mesa.
    prazo-maximo-dias: 180
